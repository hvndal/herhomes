# Deploy Her Homes Co. to GitHub Pages.
#
# One-time setup in the repo, on github.com:
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
#   Settings -> Pages -> Custom domain: herhomes.shop  (then tick "Enforce HTTPS"
#   once the certificate has been issued, which usually takes a few minutes)
#
# DNS at whoever sells herhomes.shop — four A records for the apex plus one
# CNAME for www:
#   A     @      185.199.108.153
#   A     @      185.199.109.153
#   A     @      185.199.110.153
#   A     @      185.199.111.153
#   CNAME www    hvndal.github.io
#
# After that, every push to main rebuilds and republishes the site.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let a newer push finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install build dependencies
        run: npm ci --no-audit --no-fund

      # The generated HTML is committed, so this guards against the one
      # mistake that would silently undo the SEO work: editing js/data.js
      # and deploying without re-running the prerender, which would ship
      # copy that only exists in JavaScript again.
      - name: Verify prerendered HTML is up to date with js/data.js
        run: npm run check

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
