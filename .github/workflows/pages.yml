# Deploy Her Homes Co. to GitHub Pages.
#
# ⚠️ REQUIRED ONE-TIME SETUP — this workflow cannot do it for you, and it
# fails at the "configure-pages" step until it is done:
#
#   github.com/hvndal/herhomes -> Settings -> Pages
#     Build and deployment -> Source: "GitHub Actions"   <- not "Deploy from a branch"
#     Custom domain: herhomes.shop
#     Enforce HTTPS: tick it once the certificate is issued (a few minutes)
#
# DNS at whoever sells herhomes.shop — four A records for the apex plus one
# CNAME for www:
#   A     @      185.199.108.153
#   A     @      185.199.109.153
#   A     @      185.199.110.153
#   A     @      185.199.111.153
#   CNAME www    hvndal.github.io
#
# ⚠️ CURRENTLY DISABLED ON PUSH — this repo deploys through Vercel.
#
# This workflow was written assuming GitHub Pages was the host. It turned
# out Vercel is already connected to the repo and building it, and two
# hosts cannot both own herhomes.shop. Rather than delete the work, the
# push trigger is removed so it stops failing on every commit; it can
# still be run by hand from the Actions tab.
#
# To switch to GitHub Pages instead of Vercel: restore the `push:` trigger
# below, do the Settings -> Pages setup above, and disconnect the Vercel
# project (or at least move the domain off it). To commit to Vercel for
# good: delete this file and CNAME.
name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let a newer push finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No `npm ci` on purpose. The only thing CI needs to run is the
      # prerender check, which is deliberately plain Node with zero
      # dependencies. Installing anyway pulled in sharp (~100 MB of
      # platform binaries) purely so it could sit in node_modules and get
      # swept into the uploaded site artifact by the `path: .` below.
      #
      # This guards against the one mistake that would silently undo the
      # SEO work: editing js/data.js and deploying without re-running the
      # prerender, which would ship copy that only exists in JavaScript.
      - name: Verify prerendered HTML is up to date with js/data.js
        run: node scripts/prerender.mjs --check

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
